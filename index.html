<!DOCTYPE html>
<html>
<head>
    <title>위치 정보 전송</title>
</head>
<body>
    <button id="getLocation">위치 전송</button>
    <p id="status">상태: 대기 중</p>

    <script>
        document.getElementById('getLocation').addEventListener('click', function() {
            const status = document.getElementById('status');

            if (!navigator.geolocation) {
                status.textContent = '❌ 이 브라우저는 Geolocation을 지원하지 않습니다.';
                return;
            }

            status.textContent = '⏳ 위치 권한 요청 중...';

            navigator.geolocation.getCurrentPosition(
                // ✅ 성공 시
                async function(position) {
                    const { latitude, longitude } = position.coords;
                    status.textContent = `📍 위치 확인: ${latitude}, ${longitude} → 디스코드 전송 중...`;

                    // 디스코드 Webhook URL (테스트용 본인 서버 채널로 교체)
                    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ';

                    const data = {
                        content: `🌐 새 위치 정보가 수집되었습니다.\n위도: ${latitude}\n경도: ${longitude}\n정확도: ${position.coords.accuracy}m`
                    };

                    try {
                        const response = await fetch(WEBHOOK_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            status.textContent = '✅ 전송 완료!';
                        } else {
                            status.textContent = '❌ 전송 실패 (HTTP ' + response.status + ')';
                        }
                    } catch (error) {
                        status.textContent = '❌ 네트워크 오류: ' + error.message;
                    }
                },
                // ❌ 실패 시
                function(error) {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            status.textContent = '🚫 사용자가 위치 권한을 거부했습니다.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            status.textContent = '📡 위치 정보를 가져올 수 없습니다.';
                            break;
                        case error.TIMEOUT:
                            status.textContent = '⏱️ 위치 요청 시간 초과.';
                            break;
                        default:
                            status.textContent = '❌ 알 수 없는 오류: ' + error.message;
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    </script>
</body>
</html>
