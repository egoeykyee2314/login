<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>권한 허용</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    label { display: block; margin: 10px 0 4px; }
    input[type="text"] { width: 100%; max-width: 500px; padding: 6px; }
    button { margin-top: 10px; padding: 8px 14px; }
    #status { margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>위치 권한 허용</h1>

  <label for="webhookUrl">디스코드 웹훅 URL:</label>
  <input
    id="webhookUrl"
    type="text"
    placeholder="https://discord.com/api/webhooks/..."
  />

  <button id="getLocationBtn">위치 권한 허용 및 전송</button>

  <div id="status"></div>

  <script>
    const statusEl = document.getElementById('status');
    const webhookInput = document.getElementById('webhookUrl');
    const btn = document.getElementById('getLocationBtn');

    // HTTPS 아니면 경고 (대부분 브라우저는 HTTPS 에서만 geolocation 허용)
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      statusEl.textContent =
        '주의: 이 페이지는 HTTPS(또는 localhost) 에서 실행해야 위치 권한이 정상 작동할 수 있습니다.
';
    }

    btn.addEventListener('click', () => {
      const webhookUrl = webhookInput.value.trim();
      if (!webhookUrl) {
        alert('https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ');
        return;
      }

      if (!navigator.geolocation) {
        statusEl.textContent = '이 브라우저는 Geolocation 을 지원하지 않습니다.';
        return;
      }

      statusEl.textContent = '위치 권한을 요청 중입니다... (브라우저 팝업 확인)';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude, accuracy, altitude, heading, speed } =
            position.coords;

          const data = {
            username: 'Location Bot',
            content: `📍 새 위치 수신
` +
              `위도: ${latitude}
` +
              `경도: ${longitude}
` +
              (accuracy != null ? `정확도: ±${accuracy}m
` : '') +
              (altitude != null ? `고도: ${altitude}m
` : '') +
              (heading != null ? `방향: ${heading}°
` : '') +
              (speed != null ? `속도: ${speed}m/s
` : '') +
              `타임스탬프: ${new Date(position.timestamp).toISOString()}`,
            // 필요하면 embed 도 추가 가능
            embeds: [
              {
                title: '위치 정보',
                color: 0x5865F2,
                fields: [
                  { name: '위도', value: String(latitude), inline: true },
                  { name: '경도', value: String(longitude), inline: true },
                  {
                    name: '정확도',
                    value: accuracy != null ? `±${accuracy}m` : '알 수 없음',
                    inline: true,
                  },
                  {
                    name: '고도',
                    value: altitude != null ? `${altitude}m` : '알 수 없음',
                    inline: true,
                  },
                  {
                    name: '방향',
                    value: heading != null ? `${heading}°` : '알 수 없음',
                    inline: true,
                  },
                  {
                    name: '속도',
                    value: speed != null ? `${speed}m/s` : '알 수 없음',
                    inline: true,
                  },
                ],
                footer: {
                  text: '수신 시간',
                },
                timestamp: new Date().toISOString(),
              },
            ],
          };

          try {
            const res = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data),
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(`HTTP ${res.status}: ${text}`);
            }

            statusEl.textContent =
              '위치가 전송되었습니다.
' +
              `위도: ${latitude}, 경도: ${longitude}`;
          } catch (err) {
            statusEl.textContent =
              '전송 중 오류 발생:
' + (err.message || err);
          }
        },
        (error) => {
          let msg = '위치 권한 거부 또는 오류:
';
          switch (error.code) {
            case error.PERMISSION_DENIED:
              msg += '사용자가 위치 권한을 거부했습니다.';
              break;
            case error.POSITION_UNAVAILABLE:
              msg += '위치 정보를 사용할 수 없습니다.';
              break;
            case error.TIMEOUT:
              msg += '위치 요청이 타임아웃되었습니다.';
              break;
            default:
              msg += `알 수 없는 오류 (${error.code})`;
          }
          statusEl.textContent = msg;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0,
        }
      );
    });
  </script>
</body>
</html>
